# Servidor de la SPA + proxy a la API. Mismo origen => cookie de sesion SameSite y CSRF sin CORS.
# TLS: terminar en un proxy/balanceador delante (HSTS se envia solo sobre HTTPS) o agregar aqui los certificados.
server_tokens off;
client_max_body_size 1m;                 # limite de cuerpo (tambien para "chunked")

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (CSP estricta: sin 'unsafe-inline'; los estilos de Vue van en archivos .css)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # solo tiene efecto sobre HTTPS

    location /api/ {
        proxy_pass http://backend:8080;                  # nombre del servicio en docker compose / red privada
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # no se confia en un X-Forwarded-For entrante
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # (repetir las cabeceras de seguridad: add_header en un location anula las del server)
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
