name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-only
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/app_test
      TEST_DB_MIGRATOR_PASSWORD: ci-migrator
      TEST_DB_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Crear roles de BD (migrador y aplicacion, minimo privilegio)
        run: |
          PGPASSWORD=ci-admin-only psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 \
            -v migrator_pw=ci-migrator -v runtime_pw=ci-runtime -f db/roles.sql
      - name: Pruebas unitarias, de integracion y de seguridad
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci                 # instalacion reproducible desde el lockfile
      - run: npm run build          # incluye vue-tsc (tipos)
      - run: npm test
