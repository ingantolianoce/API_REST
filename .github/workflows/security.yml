name: Security
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "23 5 * * 1"           # semanal: detecta vulnerabilidades nuevas en dependencias ya publicadas
permissions:
  contents: read

jobs:
  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2     # organizaciones: requiere GITLEAKS_LICENSE; cuentas personales: gratis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    strategy:
      fail-fast: false
      matrix: { language: [java-kotlin, javascript-typescript] }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}", build-mode: none, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  dependencies:
    name: Dependencias (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: npm audit (falla en severidad alta/critica)
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high
      - name: OSV-Scanner (Maven y npm; falla ante vulnerabilidades conocidas)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest \
            scan source --lockfile=/src/frontend/package-lock.json --lockfile=/src/backend/pom.xml

  dependency-review:
    name: Revision de dependencias nuevas (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with: { fail-on-severity: high }
